
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f6f9;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .add-btn {
            background: #198754;
        }

        .update-btn {
            background: #0d6efd;
        }

        .delete-btn {
            background: #dc3545;
        }

        .refresh-btn {
            background: #6c757d;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
        }

        .hidden {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #eef1f5;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .actions button {
                flex: 1;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>User Management System</h1>

    <!-- Action Buttons -->
    <div class="card">
        <div class="actions">
            <button class="add-btn" onclick="showForm('add')">
                Add User
            </button>

            <button class="update-btn" onclick="showForm('update')">
                Update User
            </button>

            <button class="delete-btn" onclick="showForm('delete')">
                Delete User
            </button>

            <button class="refresh-btn" onclick="loadUsers()">
                Refresh Users
            </button>
        </div>
    </div>

    <!-- Add User Form -->
    <div class="card hidden" id="addForm">
        <h2>Add New User</h2>

        <form id="addUserForm">
            <label>Name</label>
            <input type="text" id="addName" placeholder="Enter name" required>

            <label>Age</label>
            <input type="number" id="addAge" placeholder="Enter age" min="0" required>

            <div class="form-buttons">
                <button type="submit" class="add-btn">Save User</button>
                <button type="button" class="refresh-btn" onclick="hideForms()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Update User Form -->
    <div class="card hidden" id="updateForm">
        <h2>Update User</h2>

        <form id="updateUserForm">
            <label>Select User</label>
            <select id="updateUserId" required>
                <option value="">Select User</option>
            </select>

            <label>Name</label>
            <input type="text" id="updateName" placeholder="Enter new name" required>

            <label>Age</label>
            <input type="number" id="updateAge" placeholder="Enter new age" min="0" required>

            <div class="form-buttons">
                <button type="submit" class="update-btn">Update User</button>
                <button type="button" class="refresh-btn" onclick="hideForms()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Delete User Form -->
    <div class="card hidden" id="deleteForm">
        <h2>Delete User</h2>

        <form id="deleteUserForm">
            <label>Select User</label>
            <select id="deleteUserId" required>
                <option value="">Select User</option>
            </select>

            <div class="form-buttons">
                <button type="submit" class="delete-btn">Delete User</button>
                <button type="button" class="refresh-btn" onclick="hideForms()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Message -->
    <div id="message" class="message"></div>

    <!-- Users Table -->
    <div class="card">
        <h2>All Users</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                </tr>
            </thead>

            <tbody id="usersTable">
                <tr>
                    <td colspan="3">Loading users...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script>
    // FastAPI backend URL
    const API_URL = "http://127.0.0.1:8000";

    // Load all users when page opens
    document.addEventListener("DOMContentLoaded", loadUsers);


    // Show selected form
    function showForm(type) {
        hideForms();

        document.getElementById(type + "Form").classList.remove("hidden");

        clearMessage();
    }


    // Hide all forms
    function hideForms() {
        document.getElementById("addForm").classList.add("hidden");
        document.getElementById("updateForm").classList.add("hidden");
        document.getElementById("deleteForm").classList.add("hidden");
    }


    // Display success or error message
    function showMessage(message, type) {
        const messageElement = document.getElementById("message");

        messageElement.textContent = message;
        messageElement.className = "message " + type;
    }


    function clearMessage() {
        document.getElementById("message").textContent = "";
    }


    // GET: Fetch all users
    async function loadUsers() {
        const table = document.getElementById("usersTable");

        try {
            const response = await fetch(`${API_URL}/users`);

            if (!response.ok) {
                throw new Error("Unable to fetch users");
            }

            const users = await response.json();

            table.innerHTML = "";

            if (users.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="3">No users found</td>
                    </tr>
                `;
            }

            users.forEach(user => {
                const row = document.createElement("tr");

                [user.id, user.name, user.age].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });

            updateDropdowns(users);

        } catch (error) {
            table.innerHTML = `
                <tr>
                    <td colspan="3">Failed to load users. Check the backend.</td>
                </tr>
            `;

            showMessage(error.message, "error");
        }
    }


    // Populate Update and Delete dropdowns
    function updateDropdowns(users) {
        const updateSelect = document.getElementById("updateUserId");
        const deleteSelect = document.getElementById("deleteUserId");

        updateSelect.innerHTML = '<option value="">Select User</option>';
        deleteSelect.innerHTML = '<option value="">Select User</option>';

        users.forEach(user => {
            const option1 = document.createElement("option");
            option1.value = user.id;
            option1.textContent = `${user.id} - ${user.name}`;

            const option2 = document.createElement("option");
            option2.value = user.id;
            option2.textContent = `${user.id} - ${user.name}`;

            updateSelect.appendChild(option1);
            deleteSelect.appendChild(option2);
        });
    }


    // Load selected user's details into Update form
    document.getElementById("updateUserId").addEventListener("change", async function() {
        const id = this.value;

        if (!id) {
            document.getElementById("updateName").value = "";
            document.getElementById("updateAge").value = "";
            return;
        }

        try {
            const response = await fetch(`${API_URL}/user/${id}`);

            if (!response.ok) {
                throw new Error("Unable to fetch selected user");
            }

            const user = await response.json();

            document.getElementById("updateName").value = user.name;
            document.getElementById("updateAge").value = user.age;

        } catch (error) {
            showMessage(error.message, "error");
        }
    });


    // POST: Add new user
    document.getElementById("addUserForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const user = {
            name: document.getElementById("addName").value.trim(),
            age: document.getElementById("addAge").value
        };

        if (!user.name) {
            showMessage("Please enter a name", "error");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/user`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "Failed to add user");
            }

            showMessage("User added successfully!", "success");

            this.reset();
            hideForms();
            await loadUsers();

        } catch (error) {
            showMessage(error.message, "error");
        }
    });


    // PUT: Update existing user
    document.getElementById("updateUserForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const id = document.getElementById("updateUserId").value;

        const user = {
            name: document.getElementById("updateName").value.trim(),
            age: document.getElementById("updateAge").value
        };

        if (!id || !user.name) {
            showMessage("Please select a user and enter a name", "error");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/user/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "Failed to update user");
            }

            showMessage("User updated successfully!", "success");

            this.reset();
            hideForms();
            await loadUsers();

        } catch (error) {
            showMessage(error.message, "error");
        }
    });


    // DELETE: Delete selected user
    document.getElementById("deleteUserForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const id = document.getElementById("deleteUserId").value;

        if (!id) {
            showMessage("Please select a user", "error");
            return;
        }

        const confirmed = confirm("Are you sure you want to delete this user?");

        if (!confirmed) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/user/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.detail || "Failed to delete user");
            }

            showMessage("User deleted successfully!", "success");

            this.reset();
            hideForms();
            await loadUsers();

        } catch (error) {
            showMessage(error.message, "error");
        }
    });

</script>

</body>
</html>
